[package]
name = "orangmove"
version = "1.0.0"
edition = "2021"

[lib]
name = "orangmove"
path = "src/lib.rs"

[[bin]]
name = "orangmove"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "limit", "cors"] }
tower = { version = "0.5", features = ["util"] }
tower_governor = "0.4"
mime = "0.3"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "macros"] }
rand = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
time = "0.3"
hmac = "0.12"
sha1 = "0.10"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json"] }
tempfile = "3"
tokio-tungstenite = "0.24"